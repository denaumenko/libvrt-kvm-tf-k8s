---
- name: Manage IP routes for Wi-Fi interface
  hosts: localhost
  gather_facts: no
  become: yes
  vars:
    node_action: "add"
    metric: 10

  tasks:
    - name: Extract IPs from inventory groups
      ansible.builtin.set_fact:
        target_ips: >-
          {{ groups['microk8s_HA'] | map('extract', hostvars, 'ansible_ssh_host') | list +
             groups['microk8s_WORKERS'] | map('extract', hostvars, 'ansible_ssh_host') | list }}

    - name: Get Wi-Fi interface name
      ansible.builtin.shell:
        cmd: |
          ip link show |
          grep -Eo '^[0-9]+: (wlp|wlan)[^:]*' |
          awk '{print $2}'
      register: wifi_interface_name
      changed_when: false

    - name: Strip any extra whitespace from Wi-Fi interface name
      ansible.builtin.set_fact:
        clean_wifi_interface_name: "{{ wifi_interface_name.stdout | trim }}"

    - name: Debug the cleaned Wi-Fi interface name (optional)
      ansible.builtin.debug:
        msg: "The detected Wi-Fi interface is: {{ clean_wifi_interface_name }}"

    - name: Manage IP routes based on node_action
      when: node_action == "add"
      ansible.builtin.shell:
        cmd: |
          ip route add {{ item }}/32 dev {{ clean_wifi_interface_name }} metric {{ metric }}
      loop: "{{ target_ips }}"

    - name: Manage IP routes based on node_action
      when: node_action == "remove"
      ansible.builtin.shell:
        cmd: |
          ip route del {{ item }}/32 dev {{ clean_wifi_interface_name }}
      loop: "{{ target_ips }}"
