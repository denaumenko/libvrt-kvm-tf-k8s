---
- name: Create and Verify Default StorageClass in Kubernetes cluster
  hosts: microk8s_HA
  tasks:


    - name: Create local-path-provisioner StorageClass
      shell: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
      register: create_local_path_provisioner_result
      ignore_errors: true

    - name: Verify local-path-provisioner creation
      shell: |
        kubectl -n local-path-storage get pod
        kubectl get StorageClass
      register: check_local_path_provisioner_class
      failed_when: check_local_path_provisioner_class is failed
    - debug: msg="{{ check_local_path_provisioner_class.stdout }}"


    - name: Make local-path default StorageClass
      shell: |
        kubectl patch StorageClass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      register: make_local_path_default_storage_class
      failed_when: check_local_path_provisioner_class is failed
    - debug: msg="{{ check_local_path_provisioner_class.stdout }}"
